---
# Каталог с drop-in файлами sudo (sudoers_path модуля)
sms_sudoers_dir: /etc/sudoers.d

# Установить пакет sudo (и visudo), если его нет
sms_sudoers_install_sudo: true

# Список правил — параметры модуля community.general.sudoers как есть:
# name (обязательно, это же имя файла), user ИЛИ group, commands, state,
# и необязательные host/runas/nopassword/setenv/noexec/defaults.
# https://docs.ansible.com/ansible/latest/collections/community/general/sudoers_module.html
#
# - name: alice-passwd
#   user: alice
#   runas: root
#   nopassword: true
#   commands: /usr/bin/passwd alice
sms_sudoers_rules: []
