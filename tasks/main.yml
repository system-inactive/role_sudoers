---
- name: Установить sudo
  ansible.builtin.package:
    name: sudo
    state: present
  when: sms_sudoers_install_sudo

# Поля user/host/runas/commands/setenv/noexec/defaults берутся из элемента
# как есть и передаются модулю без изменений; если поле не задано в
# элементе, используется значение по умолчанию самого модуля.
# nopassword — исключение: по умолчанию false (у модуля — true, т.е.
# passwordless), чтобы пароль требовался, пока не указано обратное.
- name: Применить правила sudo
  community.general.sudoers:
    name: "{{ item.name }}"
    state: "{{ item.state | default('present') }}"
    sudoers_path: "{{ sms_sudoers_dir }}"
    validation: required
    user: "{{ item.user | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    commands: "{{ item.commands | default(omit) }}"
    host: "{{ item.host | default(omit) }}"
    runas: "{{ item.runas | default(omit) }}"
    nopassword: "{{ item.nopassword | default(false) }}"
    setenv: "{{ item.setenv | default(omit) }}"
    noexec: "{{ item.noexec | default(omit) }}"
    defaults: "{{ item.defaults | default(omit) }}"
  loop: "{{ sms_sudoers_rules }}"
  loop_control:
    label: "{{ item.name | default('?') }}"

- name: Проверить итоговую конфигурацию sudo
  ansible.builtin.command: visudo -c
  changed_when: false
