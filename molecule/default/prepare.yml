---
# Готовим состояние, на котором проверяются absent и purge: два файла с
# префиксом роли, которых не будет в наборе правил converge. prepare прогоняется
# один раз до первого converge, поэтому проверку идемпотентности он не ломает.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Убедиться, что sudo (и visudo) установлен
      ansible.builtin.package:
        name: sudo
        state: present

    - name: Оставить «осиротевший» файл — его должен убрать purge
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible-orphan
        content: "# осиротевший файл, должен быть удалён purge\n"
        owner: root
        group: root
        mode: "0440"

    - name: Оставить файл, который роль должна убрать по state=absent
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible-legacy
        content: "# устаревший файл, должен быть удалён по state=absent\n"
        owner: root
        group: root
        mode: "0440"
