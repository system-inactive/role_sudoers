---
- name: Converge
  hosts: all
  become: true
  vars:
    sms_sudoers_rules:
      # present + NOPASSWD + список команд, runas по умолчанию модуля (root)
      - name: deploy-nginx
        user: deploy
        nopassword: true
        commands:
          - /usr/bin/systemctl restart nginx
          - /usr/bin/systemctl reload nginx
      # present + defaults (Defaults:...) + правило для группы, требует пароль
      - name: admins
        group: admins
        commands: ALL
        defaults:
          - "timestamp_timeout=5"
      # сменить свой пароль без запроса пароля sudo
      - name: alice-passwd
        user: alice
        runas: root
        nopassword: true
        commands: /usr/bin/passwd alice
      # state: absent — не должно создать файл
      - name: old-rule
        state: absent
  roles:
    - role: sms_sudoers
